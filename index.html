<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ==========================================
        // 1. UTILS & MATHEMATICAL CORE FUNCTIONS
        // ==========================================

        // Format Uang
        const formatCurrency = (value, currency = 'IDR') => {
            if (isNaN(value) || value === null) return '0';
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: currency,
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(value);
        };

        // Format Angka Biasa
        const formatNumber = (value) => {
            if (isNaN(value) || value === null) return '0';
            return new Intl.NumberFormat('id-ID').format(value);
        };

        // Mengurai string input dengan koma/titik ke float
        const parseNumber = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            const cleanStr = val.replace(/[^0-9,-]+/g,"").replace(/,/g, ".");
            const parsed = parseFloat(cleanStr);
            return isNaN(parsed) ? 0 : parsed;
        };

        /**
         * Kalkulasi Future Value (FV) - Hasil Akhir
         * P = Principal (Modal Awal)
         * PMT = Payment (Setoran)
         * r = Rate per periode (Desimal)
         * n = Jumlah periode
         * type = 0 (Akhir periode), 1 (Awal periode)
         */
        const calcFV = (P, PMT, r, n, type = 0) => {
            if (r === 0) return P + (PMT * n);
            const compoundFactor = Math.pow(1 + r, n);
            const pmtFactor = (compoundFactor - 1) / r;
            const typeFactor = type === 1 ? (1 + r) : 1;
            return (P * compoundFactor) + (PMT * pmtFactor * typeFactor);
        };

        /**
         * Kalkulasi Payment (PMT) - Setoran Berkala yang dibutuhkan
         */
        const calcPMT = (FV, P, r, n, type = 0) => {
            if (r === 0) return (FV - P) / (n === 0 ? 1 : n);
            const compoundFactor = Math.pow(1 + r, n);
            const pmtFactor = (compoundFactor - 1) / r;
            const typeFactor = type === 1 ? (1 + r) : 1;
            return (FV - (P * compoundFactor)) / (pmtFactor * typeFactor);
        };

        /**
         * Kalkulasi NPER - Durasi yang dibutuhkan
         */
        const calcNPER = (FV, P, PMT, r, type = 0) => {
            if (r === 0) return PMT === 0 ? 0 : (FV - P) / PMT;
            const typeFactor = type === 1 ? (1 + r) : 1;
            const num = (FV * r + PMT * typeFactor);
            const den = (P * r + PMT * typeFactor);
            if (den <= 0) return 0; // Infinite/Impossible
            return Math.log(num / den) / Math.log(1 + r);
        };

        /**
         * Kalkulasi RATE - Newton-Raphson Method untuk mencari bunga
         */
        const calcRATE = (nper, pmt, pv, fv, type = 0, guess = 0.1) => {
            if (nper <= 0) return 0;
            let rate = guess;
            let y, y0, y1, x0, x1 = 0, f = 0, i = 0;
            let maxIter = 100;
            let epsMax = 1e-6;

            const f_rate = (r) => {
                if(r===0) return pv + pmt*nper - fv;
                return pv * Math.pow(1+r, nper) + pmt * (1 + r*type) * (Math.pow(1+r, nper) - 1)/r - fv;
            };

            const f_prime_rate = (r) => {
                if(r===0) return pmt*nper;
                let term1 = pv * nper * Math.pow(1+r, nper-1);
                let term2 = pmt * type * (Math.pow(1+r, nper) - 1)/r;
                let term3 = pmt * (1+r*type) * (nper*Math.pow(1+r, nper-1)*r - (Math.pow(1+r, nper)-1))/(r*r);
                return term1 + term2 + term3;
            };

            for (i = 0; i < maxIter; i++) {
                y = f_rate(rate);
                let yprime = f_prime_rate(rate);
                if (Math.abs(y) < epsMax) return rate;
                let newRate = rate - y/yprime;
                if (Math.abs(newRate - rate) < epsMax) return newRate;
                rate = newRate;
            }
            return rate; // Jika tidak konvergen, kembalikan rate terakhir
        };

        // Random Normal Distribution untuk Monte Carlo (Box-Muller)
        const randomNormal = (mean = 0, stdev = 1) => {
            let u = 1 - Math.random(); // (0, 1]
            let v = Math.random();
            let z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            return z * stdev + mean;
        };


        // ==========================================
        // 2. UI COMPONENTS (ICONS & WIDGETS)
        // ==========================================

        const Icons = {

            Sun: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
            DollarSign: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Printer: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 ${className}`}>
                {children}
            </div>
        );

        const StatBox = ({ title, value, subtitle, highlight = false, color="blue" }) => {
            const colors = {
                blue: "text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20",
                green: "text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/20",
                purple: "text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20",
                orange: "text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20",
            };
            
            return (
                <div className={`p-4 rounded-lg border ${highlight ? 'border-blue-200 dark:border-blue-800 ' + colors[color] : 'border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50'}`}>
                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium mb-1">{title}</p>
                    <p className={`text-2xl font-bold ${highlight ? '' : 'text-gray-900 dark:text-white'}`}>{value}</p>
                    {subtitle && <p className="text-xs text-gray-400 dark:text-gray-500 mt-1">{subtitle}</p>}
                </div>
            )
        };

        const InputGroup = ({ label, value, onChange, type = "text", prefix, suffix, disabled = false, min, step }) => {
            // Internal state untuk menangani string raw (dengan koma) sebelum parse
            const [raw, setRaw] = useState(value === 0 ? "0" : value.toString());

            useEffect(() => {
                if(!disabled) {
                   setRaw(value.toString()); 
                }
            }, [value, disabled]);

            const handleChange = (e) => {
                let val = e.target.value;
                setRaw(val);
                if (val === "" || val === "-") {
                    onChange(0);
                    return;
                }
                onChange(parseNumber(val));
            };

            return (
                <div className="mb-4">
                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>
                    <div className="relative rounded-md shadow-sm">
                        {prefix && (
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span className="text-gray-500 dark:text-gray-400 sm:text-sm">{prefix}</span>
                            </div>
                        )}
                        <input
                            type={type}
                            value={disabled ? formatNumber(value) : raw}
                            onChange={handleChange}
                            disabled={disabled}
                            min={min}
                            step={step}
                            className={`block w-full sm:text-sm rounded-md transition-colors
                                ${prefix ? 'pl-10' : 'pl-3'} 
                                ${suffix ? 'pr-12' : 'pr-3'} 
                                py-2 border 
                                ${disabled 
                                    ? 'bg-gray-100 dark:bg-gray-700 text-gray-500 border-gray-200 dark:border-gray-600 cursor-not-allowed' 
                                    : 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 focus:ring-primary-500 focus:border-primary-500'}
                            `}
                        />
                        {suffix && (
                            <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <span className="text-gray-500 dark:text-gray-400 sm:text-sm">{suffix}</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const SelectGroup = ({ label, value, onChange, options }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{label}</label>
                <select
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    className="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
                >
                    {options.map((opt, i) => <option key={i} value={opt.value}>{opt.label}</option>)}
                </select>
            </div>
        );

        // ==========================================
        // 3. MAIN CALCULATOR MODULE (OMNI-DIRECTIONAL)
        // ==========================================

        const OmniCalculator = ({ currency }) => {
            // States - ALL INITIALIZED TO ZERO OR EQUIVALENT
            const [solveFor, setSolveFor] = useState('FV'); // Mode: FV, PMT, RATE, NPER
            const [principal, setPrincipal] = useState(0);
            const [contribution, setContribution] = useState(0);
            const [rate, setRate] = useState(0); // Annual Rate %
            const [years, setYears] = useState(0);
            const [targetFV, setTargetFV] = useState(0);
            const [inflation, setInflation] = useState(0);
            
            const [freqContribute, setFreqContribute] = useState(12); // Monthly default
            const [freqCompound, setFreqCompound] = useState(12); // Monthly default
            const [timing, setTiming] = useState(0); // 0 = End, 1 = Beginning

            const [results, setResults] = useState(null);
            const [schedule, setSchedule] = useState([]);
            
            // Ref for Chart instance
            const chartRef = useRef(null);
            const pieChartRef = useRef(null);

            // Perhitungan Inti
            const calculateAll = useCallback(() => {
                let P = parseFloat(principal) || 0;
                let C = parseFloat(contribution) || 0;
                let R = parseFloat(rate) || 0;
                let Y = parseFloat(years) || 0;
                let T = parseFloat(targetFV) || 0;
                let Inf = parseFloat(inflation) || 0;

                // Konversi Rate tahunan ke periodik
                let effectiveRatePerCompound = R / 100 / freqCompound;
                
                // Rasio frekuensi (misal kontribusi bulanan tapi compound tahunan)
                // Pendekatan standar: sesuaikan kontribusi ke frekuensi compound atau sebaliknya.
                // Untuk presisi tinggi, kita samakan periode ke frekuensi kontribusi, dan hitung effective rate per contribution.
                let periods = Y * freqContribute;
                let ratePerContribute = Math.pow(1 + (R/100/freqCompound), freqCompound/freqContribute) - 1;

                let calculatedFV = 0;
                let calculatedPMT = C;
                let calculatedNPER = periods;
                let calculatedRate = ratePerContribute;
                let calculatedTarget = T;

                try {
                    switch (solveFor) {
                        case 'FV':
                            calculatedFV = calcFV(P, C, ratePerContribute, periods, timing);
                            calculatedTarget = calculatedFV;
                            break;
                        case 'PMT':
                            calculatedPMT = calcPMT(T, P, ratePerContribute, periods, timing);
                            C = calculatedPMT;
                            calculatedFV = T;
                            break;
                        case 'RATE':
                            calculatedRate = calcRATE(periods, C, P, T, timing);
                            // Convert back to annual nominal rate
                            R = (Math.pow(1 + calculatedRate, freqContribute/freqCompound) - 1) * freqCompound * 100;
                            calculatedFV = T;
                            break;
                        case 'NPER':
                            calculatedNPER = calcNPER(T, P, C, ratePerContribute, timing);
                            Y = calculatedNPER / freqContribute;
                            periods = calculatedNPER;
                            calculatedFV = T;
                            break;
                    }
                } catch (e) {
                    console.error("Math Error", e);
                    return;
                }

                // Generasi Jadwal Amortisasi / Pertumbuhan
                let currentBalance = P;
                let totalInvested = P;
                let sched = [];
                let yearlyData = {};

                // Safeguard against infinite loops if periods is too high due to invalid inputs
                let loopPeriods = Math.min(periods, 12000); // Max 1000 years monthly
                if (loopPeriods < 0 || isNaN(loopPeriods)) loopPeriods = 0;

                for (let i = 1; i <= Math.ceil(loopPeriods); i++) {
                    let interest = currentBalance * ratePerContribute;
                    let cont = (i <= periods) ? C : 0;
                    
                    if (timing === 1) { // Beginning of period
                        interest = (currentBalance + cont) * ratePerContribute;
                        currentBalance += cont + interest;
                    } else { // End of period
                        currentBalance += interest + cont;
                    }
                    
                    totalInvested += cont;

                    let year = Math.ceil(i / freqContribute);
                    
                    // Simpan data bulanan
                    sched.push({
                        period: i,
                        year: year,
                        contribution: cont,
                        interest: interest,
                        balance: currentBalance,
                        totalInvested: totalInvested
                    });

                    // Akumulasi data tahunan untuk grafik
                    if (!yearlyData[year]) {
                        yearlyData[year] = { year, balance: 0, invested: 0 };
                    }
                    yearlyData[year].balance = currentBalance;
                    yearlyData[year].invested = totalInvested;
                }

                // Kalkulasi Inflasi
                let realValue = calculatedFV / Math.pow(1 + (Inf/100), Y);
                let totalInterest = calculatedFV - totalInvested;
                let roi = totalInvested > 0 ? (totalInterest / totalInvested) * 100 : 0;

                setResults({
                    futureValue: calculatedFV,
                    totalInvested: totalInvested,
                    totalInterest: totalInterest,
                    realValue: realValue,
                    calculatedPMT: C,
                    calculatedRate: R,
                    calculatedYears: Y,
                    roi: roi,
                    yearlyData: Object.values(yearlyData)
                });
                setSchedule(sched);

            }, [principal, contribution, rate, years, targetFV, inflation, freqContribute, freqCompound, timing, solveFor]);

            useEffect(() => {
                calculateAll();
            }, [calculateAll]);

            // Chart Render Effect
            useEffect(() => {
                if (!results || !results.yearlyData.length) return;

                const ctxLine = document.getElementById('growthChart');
                const ctxPie = document.getElementById('compositionChart');

                if (chartRef.current) chartRef.current.destroy();
                if (pieChartRef.current) pieChartRef.current.destroy();

                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#e2e8f0' : '#475569';
                const gridColor = isDark ? '#334155' : '#e2e8f0';

                // Line/Area Chart
                chartRef.current = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: results.yearlyData.map(d => `Thn ${d.year}`),
                        datasets: [
                            {
                                label: 'Total Saldo',
                                data: results.yearlyData.map(d => d.balance),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: 'Total Modal Disetor',
                                data: results.yearlyData.map(d => d.invested),
                                borderColor: '#10b981',
                                borderDash: [5, 5],
                                backgroundColor: 'transparent',
                                fill: false,
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { labels: { color: textColor } },
                            tooltip: { 
                                callbacks: { 
                                    label: function(context) {
                                        return context.dataset.label + ': ' + formatCurrency(context.parsed.y, currency);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { color: gridColor }, ticks: { color: textColor } },
                            y: { grid: { color: gridColor }, ticks: { color: textColor } }
                        }
                    }
                });

                // Pie Chart
                pieChartRef.current = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: ['Total Modal', 'Total Keuntungan'],
                        datasets: [{
                            data: [results.totalInvested, Math.max(0, results.totalInterest)],
                            backgroundColor: ['#10b981', '#3b82f6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { color: textColor } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let val = formatCurrency(context.parsed, currency);
                                        let total = context.dataset.data.reduce((a,b)=>a+b,0);
                                        let perc = ((context.parsed/total)*100).toFixed(1)+'%';
                                        return `${context.label}: ${val} (${perc})`;
                                    }
                                }
                            }
                        }
                    }
                });

            }, [results, currency]);


            return (
                <div className="space-y-6">
                    {/* Control Panel */}

        // Custom InputField to wrap the InputGroup with specific styling

        // ==========================================
        // 4. FIRE (Financial Independence Retire Early) CALCULATOR
        // ==========================================
        const FIRECalculator = ({ currency }) => {
            const [currentAge, setCurrentAge] = useState(0);
            const [currentSavings, setCurrentSavings] = useState(0);
            const [monthlyExpense, setMonthlyExpense] = useState(0);
            const [monthlySavings, setMonthlySavings] = useState(0);
            const [annualReturn, setAnnualReturn] = useState(0);
            const [safeWithdrawalRate, setSafeWithdrawalRate] = useState(4); // Default 4% Rule
            const [inflation, setInflation] = useState(0);

            // Perhitungan FIRE
            const targetFIRE = monthlyExpense > 0 ? (monthlyExpense * 12) / (safeWithdrawalRate / 100) : 0;
            const netReturn = ((1 + annualReturn/100) / (1 + inflation/100)) - 1; // Real return
            
            let yearsToFIRE = 0;
            if (netReturn > 0 && monthlySavings > 0) {
                // Gunakan logaritma untuk mencari NPER (mirip fungsi calcNPER)
                const r = netReturn / 12; // monthly real return
                const P = currentSavings;
                const PMT = monthlySavings;
                const FV = targetFIRE;
                
                const num = (FV * r + PMT);
                const den = (P * r + PMT);
                
                if (den > 0 && num > 0) {
                    const months = Math.log(num / den) / Math.log(1 + r);
                    yearsToFIRE = months / 12;
                }
            } else if (netReturn === 0 && monthlySavings > 0) {
                yearsToFIRE = Math.max(0, (targetFIRE - currentSavings) / (monthlySavings * 12));
            }

            const fireAge = currentAge > 0 ? currentAge + yearsToFIRE : 0;

            return (
                <Card>
                    <div className="flex items-center gap-3 mb-6">
                        <div className="p-2 bg-orange-100 dark:bg-orange-900/30 rounded-lg text-orange-600">
                            <Icons.TrendingUp />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">Kalkulator FIRE</h2>
                            <p className="text-sm text-gray-500">Kapan Anda bisa berhenti bekerja?</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <InputField label="Usia Saat Ini" value={currentAge} onChange={setCurrentAge} suffix="Thn" />
                                <InputField label="Tabungan Saat Ini" value={currentSavings} onChange={setCurrentSavings} prefix={currency} />
                            </div>
                            <InputField label="Pengeluaran Bulanan" value={monthlyExpense} onChange={setMonthlyExpense} prefix={currency} />
                            <InputField label="Investasi Bulanan" value={monthlySavings} onChange={setMonthlySavings} prefix={currency} />
                            <div className="grid grid-cols-2 gap-4">
                                <InputField label="Asumsi Return" value={annualReturn} onChange={setAnnualReturn} suffix="%" />
                                <InputField label="Asumsi Inflasi" value={inflation} onChange={setInflation} suffix="%" />
                            </div>
                            <InputField label="Safe Withdrawal Rate (SWR)" value={safeWithdrawalRate} onChange={setSafeWithdrawalRate} suffix="%" />
                            <p className="text-xs text-gray-400 mt-2">SWR 4% adalah standar umum aturan Trinity Study. Artinya Anda bisa menarik 4% dari total portofolio di tahun pertama pensiun tanpa kehabisan uang.</p>
                        </div>

                        <div className="flex flex-col justify-center items-center p-8 bg-gray-50 dark:bg-gray-800/50 rounded-xl border border-gray-100 dark:border-gray-700">
                            <h3 className="text-lg text-gray-500 font-medium mb-2">Target Dana FIRE</h3>
                            <div className="text-4xl font-black text-orange-500 mb-8">{formatCurrency(targetFIRE, currency)}</div>
                            
                            <div className="w-full space-y-4">
                                <div className="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-2">
                                    <span className="text-gray-500">Estimasi Waktu</span>
                                    <span className="font-bold text-xl">{yearsToFIRE > 0 ? yearsToFIRE.toFixed(1) + ' Tahun' : '-'}</span>
                                </div>
                                <div className="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-2">
                                    <span className="text-gray-500">Usia Pensiun (FIRE)</span>
                                    <span className="font-bold text-2xl text-blue-500">{fireAge > 0 ? Math.ceil(fireAge) + ' Tahun' : '-'}</span>
                                </div>
                            </div>
                            
                            {yearsToFIRE > 50 && (
                                <div className="mt-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm w-full text-center">
                                    Target sulit tercapai. Pertimbangkan menambah investasi bulanan atau menekan pengeluaran.
                                </div>
                            )}
                        </div>
                    </div>
                </Card>
            )
        }

        // ==========================================
        // 5. PROFESSIONAL METRICS (NPV, IRR)
        // ==========================================
        const ProMetrics = ({ currency }) => {
            const [discountRate, setDiscountRate] = useState(0);
            const [initialInvestment, setInitialInvestment] = useState(0);
            const [cashflows, setCashflows] = useState([0, 0, 0]); // Default 3 years zero

            const updateCF = (idx, val) => {
                const newCF = [...cashflows];
                newCF[idx] = val;
                setCashflows(newCF);
            };

            const addYear = () => setCashflows([...cashflows, 0]);
            const removeYear = () => { if(cashflows.length > 1) setCashflows(cashflows.slice(0, -1)); }

            // Calculate NPV
            const calculateNPV = () => {
                let npv = -initialInvestment;
                const r = discountRate / 100;
                for (let i = 0; i < cashflows.length; i++) {
                    npv += cashflows[i] / Math.pow(1 + r, i + 1);
                }
                return npv;
            };

            // Calculate IRR (Simple Newton-Raphson approximation)
            const calculateIRR = () => {
                const maxIter = 1000;
                let rate = 0.1; // guess 10%
                
                const npvForRate = (r) => {
                    let val = -initialInvestment;
                    for (let i = 0; i < cashflows.length; i++) {
                        val += cashflows[i] / Math.pow(1 + r, i + 1);
                    }
                    return val;
                };

                for (let i = 0; i < maxIter; i++) {
                    let npv = npvForRate(rate);
                    let npv_plus = npvForRate(rate + 0.0001);
                    let derivative = (npv_plus - npv) / 0.0001;
                    
                    if (Math.abs(derivative) < 0.000001) break;
                    let newRate = rate - (npv / derivative);
                    if (Math.abs(newRate - rate) < 0.00001) return newRate * 100;
                    rate = newRate;
                }
                return rate * 100;
            };

            const npv = initialInvestment > 0 ? calculateNPV() : 0;
            const irr = initialInvestment > 0 ? calculateIRR() : 0;

            return (
                <Card>
                    <div className="flex items-center gap-3 mb-6">
                        <div className="p-2 bg-purple-100 dark:bg-purple-900/30 rounded-lg text-purple-600">
                            <Icons.Activity />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">Analisis Investasi Profesional</h2>
                            <p className="text-sm text-gray-500">Net Present Value (NPV) & Internal Rate of Return (IRR)</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-1 space-y-4">
                            <InputField label="Modal Awal (Tahun 0)" value={initialInvestment} onChange={setInitialInvestment} prefix={currency} />
                            <InputField label="Discount Rate (Cost of Capital)" value={discountRate} onChange={setDiscountRate} suffix="%" />
                            
                            <div className="mt-6">
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Proyeksi Arus Kas (Cash Flow)</label>
                                {cashflows.map((cf, idx) => (
                                    <div key={idx} className="flex items-center gap-2 mb-2">
                                        <span className="text-sm text-gray-500 w-16">Thn {idx + 1}</span>
                                        <div className="flex-1">
                                            <InputField label="" value={cf} onChange={(v) => updateCF(idx, v)} prefix={currency} />
                                        </div>
                                    </div>
                                ))}
                                <div className="flex gap-2">
                                    <button onClick={addYear} className="flex-1 px-3 py-2 bg-gray-100 dark:bg-gray-700 text-sm rounded hover:bg-gray-200 transition">+ Tambah Tahun</button>
                                    <button onClick={removeYear} className="px-3 py-2 bg-red-50 dark:bg-red-900/30 text-red-600 text-sm rounded hover:bg-red-100 transition">-</button>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 h-max">
                            <div className={`p-6 rounded-xl border ${npv > 0 ? 'bg-green-50 border-green-200 dark:bg-green-900/20' : 'bg-red-50 border-red-200 dark:bg-red-900/20'}`}>
                                <h3 className="text-gray-500 text-sm font-medium mb-1">Net Present Value (NPV)</h3>
                                <div className={`text-3xl font-bold ${npv > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                    {formatCurrency(npv, currency)}
                                </div>
                                <p className="text-xs mt-2 text-gray-500">
                                    {npv > 0 ? "Proyek Layak Diterima (NPV Positif)" : npv === 0 ? "Titik Impas" : "Proyek Ditolak (NPV Negatif)"}
                                </p>
                            </div>

                            <div className="p-6 rounded-xl border bg-purple-50 border-purple-200 dark:bg-purple-900/20 dark:border-purple-800">
                                <h3 className="text-gray-500 text-sm font-medium mb-1">Internal Rate of Return (IRR)</h3>
                                <div className="text-3xl font-bold text-purple-600 dark:text-purple-400">
                                    {isNaN(irr) || !isFinite(irr) ? '0.00' : irr.toFixed(2)}%
                                </div>
                                <p className="text-xs mt-2 text-gray-500">
                                    {irr > discountRate ? "IRR > Discount Rate (Layak)" : "IRR < Discount Rate (Tidak Layak)"}
                                </p>
                            </div>
                        </div>
                    </div>
                </Card>
            )
        };

        // ==========================================
        // 6. MAIN APPLICATION COMPONENT
        // ==========================================

                                    >

                                    </button>
                                </div>

                        </div>
                    </nav>

                    {/* Main Workspace */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        
                        {/* Tool Selector */}
                        <div className="flex space-x-2 mb-8 overflow-x-auto pb-2 no-print">
                            <button 
                                onClick={() => setActiveTab('omni')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2
                                    ${activeTab === 'omni' ? 'bg-primary-100 text-primary-700 dark:bg-primary-900/50 dark:text-primary-300' : 'text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800'}`}
                            >
                                <Icons.Calculator /> Kalkulator Pusat (Omni-Directional)
                            </button>
                            <button 
                                onClick={() => setActiveTab('fire')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2
                                    ${activeTab === 'fire' ? 'bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300' : 'text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800'}`}
                            >
                                <Icons.TrendingUp /> Simulasi FIRE & Pensiun
                            </button>
                            <button

                                    ${activeTab === 'pro' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300' : 'text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800'}`}

                                <Icons.Activity /> Metrik Profesional (NPV/IRR)
                            </button>
                        </div>

                        {/* Render Active Tool */}
                        <div className="transition-all">
                            {activeTab === 'omni' && <OmniCalculator currency={currency} />}
                            {activeTab === 'fire' && <FIRECalculator currency={currency} />}
                            {activeTab === 'pro' && <ProMetrics currency={currency} />}
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-8 text-center text-sm text-gray-500 mt-auto no-print">
                        <p>OmniWealth Pro &copy; 2026. Semua perhitungan adalah simulasi matematis. Tidak menjamin kinerja pasar riil.</p>
                        <p className="mt-1 text-xs">Rumus menggunakan standar perhitungan nilai waktu uang (Time Value of Money) dan bunga majemuk.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
